version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: pocketflow-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: pocketflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - pocketflow-network

  mongo-express:
    image: mongo-express:latest
    container_name: pocketflow-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - pocketflow-network

volumes:
  mongodb_data:
    driver: local

networks:
  pocketflow-network:
    driver: bridge
